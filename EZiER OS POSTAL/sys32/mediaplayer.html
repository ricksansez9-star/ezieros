<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Media Player</title><script src="ezrive.js"></script>
<style>body{display:flex;flex-direction:column}#url{flex:1}#stage{flex:1;display:flex;align-items:center;justify-content:center;background:#000;min-height:0}#v,#im{max-width:100%;max-height:100%}#v{width:100%;height:100%}#hint{position:absolute;opacity:.4;pointer-events:none}</style></head><body>
<div id="bar"><input id="url" placeholder="Paste an audio/video URL (mp3, mp4, wav…)"><button id="go">Play</button><button id="pick" class="pri">Open file…</button><input type="file" id="f" accept=".mp3,.mp4,.wav,.ogg,.webm,audio/*,video/*" hidden></div>
<div id="stage"><div id="hint">Open a file, paste a URL, or drop a file here</div><video id="v" controls autoplay hidden></video><img id="im" hidden></div>
<script>
const $=id=>document.getElementById(id);
function play(src,isImg){$('hint').hidden=true;$('v').hidden=isImg;$('im').hidden=!isImg;if(isImg)$('im').src=src;else{$('v').src=src;$('v').play().catch(()=>{})}}
$('go').onclick=()=>{const u=$('url').value.trim();if(/^https?:\/\//i.test(u))play(u,false)};$('url').onkeydown=e=>{if(e.key==='Enter')$('go').click()};
$('pick').onclick=()=>$('f').click();
const local=f=>f&&play(URL.createObjectURL(f),f.type.startsWith('image/'));
$('f').onchange=e=>local(e.target.files[0]);
addEventListener('dragover',e=>e.preventDefault());addEventListener('drop',e=>{e.preventDefault();local(e.dataTransfer.files[0])});
const p=new URLSearchParams(location.search).get('path');if(p){const d=EZRIVE.read(p);if(d)play(d,d.startsWith('data:image/'))}
</script></body></html>
