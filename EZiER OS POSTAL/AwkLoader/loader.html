<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GNU GRUB version 0.97</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

        :root {
            --green: #33ff33;
            --dim: #1c6b1c;
            --amber: #ffb000;
            --bg: #000000;
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            background: var(--bg);
            color: var(--green);
            font-family: 'Share Tech Mono', monospace;
            overflow: hidden;
            cursor: none; /* Authentic CRT/Boot screen feel */
        }

            /* Scanline Overlay for Fullscreen CRT Effect */
            body::after {
                content: '';
                position: fixed;
                inset: 0;
                background: repeating-linear-gradient( to bottom, transparent 0px, transparent 2px, rgba(0, 0, 0, 0.25) 2px, rgba(0, 0, 0, 0.25) 4px );
                pointer-events: none;
                z-index: 100;
            }

        /* Fullscreen Layout Container */
        .screen {
            width: 100%;
            height: 100%;
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .header {
            color: #00ffcc;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 0.05em;
        }

        .instructions {
            color: var(--dim);
            margin-top: 12px;
            font-size: 14px;
        }

        /* Center GRUB Box Spanning Screen Width */
        .menu-box {
            border: 2px solid var(--green);
            flex: 1;
            margin: 16px 0;
            padding: 8px 0;
            overflow-y: auto;
            scrollbar-width: none;
            box-shadow: 0 0 10px rgba(51, 255, 51, 0.1);
        }

            .menu-box::-webkit-scrollbar {
                display: none;
            }

        .entry {
            padding: 4px 16px;
            color: var(--green);
            font-size: 16px;
            user-select: none;
            white-space: pre;
        }

            .entry.selected {
                background: var(--green);
                color: var(--bg);
                font-weight: bold;
            }

        .footer {
            color: var(--dim);
            font-size: 14px;
            line-height: 1.6;
        }

        .countdown {
            color: var(--amber);
            margin-top: 6px;
        }

        /* Fullscreen Real-Time Console Screen */
        #console-log {
            display: none;
            width: 100%;
            height: 100%;
            padding: 24px;
            background: #000;
            color: #fff;
            font-size: 15px;
            line-height: 1.5;
            white-space: pre-wrap;
            overflow-y: auto;
        }

        /* Hidden File Picker for Injecting Items via Hotkey */
        #file-picker {
            display: none;
        }
    </style>
</head>
<body id="boot-loader" tabindex="0">

    <input type="file" id="file-picker" accept=".html,.htm" onchange="addOS(event)">

    <!-- Main GRUB UI -->
    <div class="screen" id="grub-ui">
        <div>
            <div class="header">GNU GRUB version 0.97</div>
            <p class="instructions">Use the ↑ and ↓ keys to select which operating system to boot.</p>
        </div>

        <div class="menu-box" id="entry-box"></div>

        <div class="footer">
            <p>Press 'ENTER' to boot the selected OS or 'I' to inject a target OS image file.</p>
            <div class="countdown" id="countdown">Booting choice automatically in 5 seconds...</div>
        </div>
    </div>

    <!-- Active Boot Console Screen -->
    <div id="console-log"></div>

    <script>
        const osEntries = [
            { label: 'Postal', path: '../sys32/EZIEROS.html' }
        ];

        let selectedIdx = 0;
        let countdownSecs = 5;
        let timerId = null;
        let grubActive = true;

        const entryBox = document.getElementById('entry-box');
        const countdownEl = document.getElementById('countdown');
        const bootLoader = document.getElementById('boot-loader');
        const filePicker = document.getElementById('file-picker');

        function renderMenu() {
            entryBox.innerHTML = '';
            osEntries.forEach((os, idx) => {
                const div = document.createElement('div');
                div.className = `entry ${idx === selectedIdx ? 'selected' : ''}`;
                div.textContent = `${idx === selectedIdx ? ' * ' : '   '}${os.label}`;

                div.onclick = () => {
                    selectedIdx = idx;
                    resetTimer();
                    renderMenu();
                };
                div.ondblclick = bootSelected;
                entryBox.appendChild(div);
            });
        }

        function startTimer() {
            timerId = setInterval(() => {
                countdownSecs--;
                if (countdownSecs <= 0) {
                    clearInterval(timerId);
                    bootSelected();
                } else {
                    countdownEl.textContent = `Booting choice automatically in ${countdownSecs} seconds...`;
                }
            }, 1000);
        }

        function resetTimer() {
            clearInterval(timerId);
            countdownEl.textContent = 'Automatic boot sequence paused. Controlled manually.';
        }

        function addOS(e) {
            const file = e.target.files[0];
            if (!file) return;

            const label = file.name.replace(/\.(html|htm)$/i, '').replace(/[_-]/g, ' ');
            const path = URL.createObjectURL(file);

            osEntries.push({ label: `Injected: ${label}`, path });
            selectedIdx = osEntries.length - 1;

            renderMenu();
            resetTimer();
        }

        async function bootSelected() {
            if (!grubActive) return;
            grubActive = false;
            clearInterval(timerId);

            const target = osEntries[selectedIdx];

            document.getElementById('grub-ui').style.display = 'none';
            const consoleLog = document.getElementById('console-log');
            consoleLog.style.display = 'block';

            const appendLog = (msg) => { consoleLog.textContent += msg + '\n'; };

            appendLog(`  Booting \u0027${target.label}\u0027`);
            await new Promise(r => setTimeout(r, 200));
            appendLog('root (hd0,0)');
            appendLog(' Filesystem type is ext2fs, partition type 0x83');
            await new Promise(r => setTimeout(r, 400));

            appendLog('kernel /boot/vmlinuz-pro-postal root=/dev/sda1 ro quiet');
            appendLog('   [Linux-bzImage, setup=0x3400, size=0x42ac10]');
            await new Promise(r => setTimeout(r, 300));

            appendLog('initrd /boot/initrd.img');
            appendLog('   [Linux-initrd @ 0x377cf000, 0x82b41 bytes]');
            await new Promise(r => setTimeout(r, 200));

            appendLog('Executing handoff... Opening graphic environment.');
            await new Promise(r => setTimeout(r, 300));

            window.location.href = target.path;
        }

        // Fullscreen Navigation Controls
        window.addEventListener('keydown', e => {
            if (!grubActive) return;

            if (e.key === 'ArrowUp') {
                e.preventDefault();
                resetTimer();
                selectedIdx = (selectedIdx - 1 + osEntries.length) % osEntries.length;
                renderMenu();
            } else if (e.key === 'ArrowDown') {
                e.preventDefault();
                resetTimer();
                selectedIdx = (selectedIdx + 1) % osEntries.length;
                renderMenu();
            } else if (e.key === 'Enter') {
                e.preventDefault();
                bootSelected();
            } else if (e.key === 'i' || e.key === 'I') {
                e.preventDefault();
                filePicker.click();
            }
        });

        // Initialize
        bootLoader.focus();
        renderMenu();
        startTimer();
    </script>
</body>
</html>
